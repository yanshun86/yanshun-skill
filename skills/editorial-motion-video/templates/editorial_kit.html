<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", -apple-system, sans-serif;
    color: #10243E; -webkit-font-smoothing: antialiased;
  }
  /* Warm Editorial Paper with Radial Vignette (Zero Grid, Zero Top HUD) */
  .canvas {
    position: relative; width: 1920px; height: 1080px;
    background: radial-gradient(circle at 50% 45%, #F8F5EE 0%, #F1ECE1 68%, #E4DDD0 100%);
  }
  .watermark {
    position: absolute; right: 44px; bottom: 30px;
    font-size: 18px; font-weight: 800; color: rgba(16, 36, 62, 0.38);
    letter-spacing: 0.6px;
  }
  .scene { position: absolute; left: 88px; right: 88px; top: 70px; bottom: 70px; display: none; }
  .scene.active { display: flex; }

  /* 1. SpotlightTree */
  .tree-wrap { width: 100%; align-items: center; justify-content: space-between; gap: 60px; }
  .tree-col { flex: 1.15; display: flex; flex-direction: column; gap: 14px; font-size: 32px; font-weight: 700; }
  .t-node { display: flex; align-items: center; gap: 14px; opacity: 0.24; padding: 6px 14px; }
  .t-node.l1 { margin-left: 48px; }
  .t-node.l2 { margin-left: 112px; }
  .t-node.lit {
    opacity: 1; background: #FFFDF9; border: 3px solid #10243E;
    border-radius: 14px; padding: 12px 22px; width: fit-content;
    box-shadow: 0 12px 28px rgba(16, 36, 62, 0.12);
    color: #10243E; font-weight: 900;
  }
  .t-title-col { flex: 0.85; display: flex; flex-direction: column; align-items: flex-start; }
  .hand-title { font-size: 76px; font-weight: 900; color: #10243E; letter-spacing: -1px; }
  .hand-line { width: 320px; height: 16px; margin-top: 8px; }

  /* 2. TimelineLoop */
  .tl-wrap { flex-direction: column; align-items: center; justify-content: center; gap: 54px; }
  .tl-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 14px; width: 100%; align-items: center; }
  .tl-dash {
    border: 2.5px dashed rgba(16, 36, 62, 0.28); border-radius: 12px;
    padding: 18px 6px; text-align: center; font-size: 20px; font-weight: 700;
    color: rgba(16, 36, 62, 0.45); background: rgba(255,255,255,0.45);
  }
  .tl-step {
    background: #FFFDF8; border: 2.5px solid #10243E; border-radius: 14px;
    padding: 16px 6px; text-align: center; font-size: 21px; font-weight: 800;
    color: #10243E; box-shadow: 0 10px 24px rgba(16, 36, 62, 0.08);
  }
  .tl-step.active { background: #10243E; color: #D6AC67; border-color: #D6AC67; transform: scale(1.04); }

  /* 3. EditorialPunch + on-air PiP */
  .punch-wrap { align-items: center; justify-content: space-between; gap: 48px; }
  .punch-left { flex: 1.45; display: flex; flex-direction: column; gap: 22px; }
  .punch-note { font-size: 22px; font-weight: 700; color: rgba(16, 36, 62, 0.52); }
  .punch-box {
    background: #10243E; color: #F7F5F0; border-radius: 18px;
    padding: 46px 56px; font-size: 76px; font-weight: 900; line-height: 1.25;
    box-shadow: 0 28px 64px rgba(16, 36, 62, 0.26);
    border-left: 10px solid #D6AC67;
  }
  .punch-box span { color: #D6AC67; }
  .pip-box {
    flex: 0.72; height: 640px; border-radius: 26px; overflow: hidden;
    background: #10243E; border: 4px solid #10243E;
    box-shadow: 0 28px 70px rgba(16, 36, 62, 0.28);
    position: relative; display: flex; align-items: center; justify-content: center;
    color: #D6AC67; font-size: 28px; font-weight: 800;
  }
  .pip-tag {
    position: absolute; top: 18px; left: 18px;
    background: rgba(16, 36, 62, 0.78); color: #F7F5F0;
    padding: 6px 14px; border-radius: 999px; font-size: 16px; font-weight: 700;
    border: 1px solid rgba(214, 172, 103, 0.45);
  }
</style>
</head>
<body>
<div class="canvas">
  <!-- Scene 1: SpotlightTree -->
  <div class="scene tree-wrap active" id="sc-tree">
    <div class="tree-col">
      <div class="t-node">📁 商业</div>
      <div class="t-node">📁 工具</div>
      <div class="t-node" style="opacity:0.9;">📁 角色</div>
      <div class="t-node l1" style="opacity:0.9;">📁 总经理</div>
      <div class="t-node l2">📄 岗位手册 AGENTS.md</div>
      <div class="t-node l2 lit">📁 工作记录</div>
      <div class="t-node l1" style="opacity:0.9;">📁 内容经理</div>
      <div class="t-node l2">📄 岗位手册 AGENTS.md</div>
      <div class="t-node l2 lit">📁 工作记录</div>
      <div class="t-node">📁 驾驶舱</div>
    </div>
    <div class="t-title-col">
      <div class="hand-title">运行数据</div>
      <svg class="hand-line" viewBox="0 0 320 16"><path d="M4 10 Q160 3 314 11" stroke="#D9531E" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
      <div style="margin-top:26px; font-size:28px; font-weight:700; color:#4A5B70; line-height:1.6;">
        无关枝干自动降维虚化，视线只聚焦当前正在讲的那一层。
      </div>
    </div>
  </div>

  <!-- Scene 2: TimelineLoop -->
  <div class="scene tl-wrap" id="sc-timeline">
    <div style="text-align:center;">
      <div class="hand-title" style="font-size:66px;">先立边界，再让 AI 干活</div>
      <svg class="hand-line" style="margin:8px auto 0;" viewBox="0 0 320 16"><path d="M6 11 Q160 4 312 10" stroke="#D9531E" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="tl-grid">
      <div class="tl-dash">你的调整</div><div class="tl-dash">你的调整</div><div class="tl-dash">你的调整</div><div class="tl-dash">你的调整</div>
      <div class="tl-dash">你的调整</div><div class="tl-dash">你的调整</div><div class="tl-dash">你的调整</div><div class="tl-dash">你的调整</div>
      <div class="tl-step">① 预检</div><div class="tl-step">② 开题</div><div class="tl-step">③ 分镜</div><div class="tl-step active">④ 定调</div>
      <div class="tl-step">⑤ 制作</div><div class="tl-step">⑥ 初版</div><div class="tl-step">⑦ 精修</div><div class="tl-step">⑧ 复盘</div>
    </div>
  </div>

  <!-- Scene 3: EditorialPunch + PiP -->
  <div class="scene punch-wrap" id="sc-punch">
    <div class="punch-left">
      <div class="punch-note">// 真实录屏 · 非编造演示</div>
      <div class="punch-box">看着很顺，<span>但你敢交吗？</span></div>
    </div>
    <div class="pip-box">
      <div class="pip-tag">● on air · 言顺</div>
      <div>真人出镜 / 实拍画中画位</div>
    </div>
  </div>

  <div class="watermark">@言顺自我进化</div>
</div>
<script>
  const p = new URLSearchParams(location.search).get('scene') || 'tree';
  document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('sc-' + p);
  if (target) target.classList.add('active');
</script>
</body>
</html>
